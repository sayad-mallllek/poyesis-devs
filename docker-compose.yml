services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poyesis
      POSTGRES_PASSWORD: poyesis
      POSTGRES_DB: poyesis
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poyesis -d poyesis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

# Production stack for poyesis.dev.
#
# Caddy runs on the host and terminates TLS; web and API are published on
# 127.0.0.1 only (ports from deploy/.env) so they never collide with other
# services. Postgres stays on the private compose network.
#
# Configuration: deploy/.env (template: deploy/.env.example). It is used both
# for `${...}` interpolation below and as the API's environment.
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build

name: poyesis

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Only its own settings — never the application secrets.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - poyesis-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - poyesis

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/.env
    # Container-level facts are fixed here rather than in the env file.
    environment:
      NODE_ENV: production
      PORT: "4000"
      STORAGE_DIR: /data/storage
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - poyesis-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4101}:4000"
    networks:
      - poyesis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4100}:3000"
    networks:
      - poyesis

volumes:
  poyesis-db:
  poyesis-storage:

networks:
  poyesis:
    driver: bridge
